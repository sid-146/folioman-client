site_name: Folioman Client
site_description: Official typed asynchronous Python SDK for the Folioman REST API.
site_url: https://sid-146.github.io/folioman-client/
repo_name: sid-146/folioman-client
repo_url: https://github.com/sid-146/folioman-client
edit_uri: edit/main/docs/

theme:
    name: material
    language: en
    palette:
        - scheme: default
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-4
              name: Switch to light mode
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.expand
        - navigation.top
        - search.highlight
        - content.code.copy
        - content.action.edit

plugins:
    - search
    - mkdocstrings:
          handlers:
              python:
                  options:
                      docstring_style: google
                      show_source: true
                      show_root_heading: true
                      members_order: source
                      separate_signature: true
                      show_signature_annotations: true

markdown_extensions:
    - admonition
    - attr_list
    - pymdownx.details
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.superfences
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.tasklist:
          custom_checkbox: true
    - toc:
          permalink: true

nav:
    - Home: index.md
    - Getting Started: getting-started.md
    - Configuration: configuration.md
    - Authentication: authentication.md
    - Client: client.md
    - Models: models.md
    - Errors: errors.md
    - Examples: examples.md
    - API Reference: api-reference.md
    - Development: development.md
