site_name: Folioman Client
site_description: Embedded typed Python portfolio engine and CLI for Indian mutual funds and equities.
site_url: https://sid-146.github.io/folioman-client/
repo_name: sid-146/folioman-client
repo_url: https://github.com/sid-146/folioman-client
edit_uri: edit/main/docs/

theme:
    name: material
    language: en
    palette:
        - scheme: default
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-4
              name: Switch to light mode
    features:
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.sections
        - navigation.top
        - navigation.path
        - navigation.prune
        - search.highlight
        - search.suggest
        - content.code.copy
        - content.action.edit

plugins:
    - search
    - mkdocstrings:
          handlers:
              python:
                  options:
                      docstring_style: google
                      show_source: true
                      show_root_heading: true
                      members_order: source
                      separate_signature: true
                      show_signature_annotations: true

markdown_extensions:
    - admonition
    - attr_list
    - md_in_html
    - pymdownx.arithmatex:
          generic: true
    - pymdownx.details
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.tasklist:
          custom_checkbox: true
    - toc:
          permalink: true

extra_css:
    - stylesheets/extra.css

extra_javascript:
    - javascripts/mathjax.js
    - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
    - Overview:
        - Home: index.md
        - Getting Started: getting-started.md
        - Installation & Setup: installation.md
        - Quickstart Guide: quickstart.md
        - System Architecture: architecture.md
        - Setup & Configuration: setup-and-configuration.md
        - Project & Module Structure: project-structure.md
        - Codebase Audit Report: CODEBASE_AUDIT.md
        - Audit Inspection Manifest: audit-appendix.md
    - Subsystems & Modules:
        - Application Services: modules/services.md
        - Core Math & Parsers: modules/core-math-and-parsers.md
        - Corporate Actions Engine: modules/core-corporate-actions.md
        - Indian Tax Engine: modules/core-tax.md
        - Market Price Feeds: modules/price-feeds.md
        - Database & Diagnostics: modules/database-and-persistence.md
        - Security & Cryptography: modules/security.md
    - Execution Flows:
        - Statement Ingestion: execution-flows/statement-ingestion.md
        - Portfolio Valuation & XIRR: execution-flows/valuation-and-xirr.md
        - Capital Gains Tax & Schedule 112A: execution-flows/capital-gains-tax.md
        - Corporate Actions Replay: execution-flows/corporate-actions.md
        - Portfolio Reconciliation: execution-flows/reconciliation.md
        - NAV Synchronization: execution-flows/nav-synchronization.md
    - Guides & Operations:
        - CLI Reference: cli.md
        - Python Client SDK: client.md
        - Error Handling & Debugging: error-handling-and-debugging.md
        - Testing & Verification: testing.md
        - Integration Examples: examples.md
        - Everyday Use Cases: SIMPLE_USE_CASES.md
    - Asset Walkthroughs:
        - Walkthrough Overview: walk through/index.md
        - Mutual Funds Flow: walk through/mutual-funds.md
        - Stocks & Equities Flow: walk through/stocks.md
        - ETFs & Other Assets Flow: walk through/etfs-and-others.md
    - Reference & Technical Specs:
        - API Reference:
            - Overview: api/index.md
            - Client & Resources: api/client.md
            - Configuration & Settings: api/config.md
            - Application Services: api/services.md
            - Exceptions & Errors: api/errors.md
        - Domain Models: models.md
        - Error Hierarchy: errors.md
        - Financial & Technical Glossary: glossary.md
        - Frequently Asked Questions (FAQ): faq.md
        - Backward Compatibility: compatibility.md
        - Development Guide: development.md
        - Future Enhancements & Roadmap: future_enhancement.md
        - Contributing Guide: contributing.md
